name: Package portable Windows OBS Bridge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/obs-bridge/**'
      - 'packages/shared/**'
      - 'portable/windows/**'
      - '.github/workflows/portable-windows-bridge.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Run mapping tests and TypeScript checks
        run: |
          npm test
          npm run typecheck -w @tally/obs-bridge
      - name: Build portable bundled Bridge
        run: npm run package:portable -w @tally/obs-bridge
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows-package | Out-Null
          Copy-Item (Get-Command node).Source dist/windows-package/OBS-TALLY-PRO-Bridge.exe
          Copy-Item ./apps/obs-bridge/dist/bridge.cjs dist/windows-package/bridge.cjs
          Copy-Item './portable/windows/*' dist/windows-package/
      - name: Smoke test portable runtime and validate Windows launcher
        shell: pwsh
        run: |
          $env:SUPABASE_URL = ''
          $out = & ./dist/windows-package/OBS-TALLY-PRO-Bridge.exe ./dist/windows-package/bridge.cjs 2>&1 | Out-String
          if ($out -notmatch 'Set HTTPS SUPABASE_URL') { throw "Portable Bridge runtime check failed: $out" }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './portable/windows/bridge-launcher.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "Launcher script syntax failed: $errors" }
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/windows-package/*' -DestinationPath 'dist/OBS-TALLY-PRO-Windows-Portable.zip' -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: OBS-TALLY-PRO-Windows-Portable
          path: dist/OBS-TALLY-PRO-Windows-Portable.zip
          retention-days: 30
