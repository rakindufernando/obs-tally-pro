# Private real-time video transport for OBS TALLY PRO v3.1.
# External authentication is mandatory for ALL publish/read operations.
logLevel: info
authMethod: http
authHTTPAddress: https://lvzrhzlcyajhhgfqgdar.supabase.co/functions/v1/media-auth
authHTTPExclude: []
api: false
metrics: false
pprof: false
playback: false
rtsp: false
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins:
